<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Comparison Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #4f6ef7;
      --accent-light: #e8ecff;
      --accent-dark: #3b52c7;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #f87171;
      --info: #60a5fa;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
      --transition: .2s ease;
    }

    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --accent-light: #1e3a5f;
      --border: #475569;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-primary);
      margin: 0;
      padding: 20px 24px;
      min-height: 100vh;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .dashboard-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* ── Dashboard subtitle ── */
    .dashboard-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Category filter groups ── */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 2px;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .filter-select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      border-left: 4px solid var(--kpi-color, var(--accent));
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(129, 140, 248, 0.15);
    }

    .kpi-card:nth-child(1) { --kpi-color: #818cf8; }
    .kpi-card:nth-child(2) { --kpi-color: #fbbf24; }
    .kpi-card:nth-child(3) { --kpi-color: #34d399; }
    .kpi-card:nth-child(4) { --kpi-color: #fb7185; }

    .kpi-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .kpi-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      background: var(--kpi-color, var(--accent));
      flex-shrink: 0;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .kpi-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* ── Skeleton loading animation ── */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--bg-primary) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      display: inline-block;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* ── KPI info tooltip ── */
    .kpi-info {
      opacity: 0.4;
      font-size: 10px;
      margin-left: 4px;
      cursor: help;
    }
    .kpi-info:hover { opacity: 0.8; }

    .chart-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .chart-card {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition);
    }

    .chart-card:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .chart-card.wide { flex: 2; }

    .chart-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .chart-container {
      width: 100%;
      height: 300px;
    }

    .chart-container.tall {
      height: 360px;
    }

    .full-width {
      width: 100%;
      margin-bottom: 20px;
    }

    .data-table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .data-table-wrapper .chart-card-title {
      margin-bottom: 12px;
    }

    /* ── Table toolbar (search + export) ── */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-search {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
      width: 200px;
    }
    .table-search:focus {
      border-color: var(--accent);
    }
    .table-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Table pagination ── */
    .table-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .table-pagination button {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .table-pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .table-pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Table row click highlight ── */
    .data-table tbody tr {
      cursor: pointer;
      transition: background var(--transition);
    }
    .data-table tbody tr.row-selected {
      background: var(--accent-light) !important;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .data-table th:hover {
      color: var(--accent);
    }

    .data-table th .sort-icon {
      margin-left: 4px;
      font-size: 10px;
      opacity: 0.4;
    }

    .data-table th.sorted .sort-icon {
      opacity: 1;
      color: var(--accent);
    }

    .data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    .data-table tbody tr:hover {
      background: var(--accent-light);
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      z-index: 1000;
    }

    .theme-toggle:hover {
      box-shadow: var(--shadow-lg);
      transform: scale(1.05);
    }

    /* ── Accent bar at top ── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #818cf8, #4ade80, #fbbf24, #f87171);
      z-index: 9999;
    }

    @media (max-width: 1024px) {
      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .chart-row {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }
      body {
        padding: 12px;
      }
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .filter-bar {
        flex-wrap: wrap;
      }
      .filter-divider { display: none; }
      .table-search { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1 class="dashboard-title">Sales Comparison Dashboard</h1>
        <p class="dashboard-subtitle" id="dashboard-subtitle">Loading data...</p>
      </div>
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-group-label">Region</span>
          <button class="filter-btn region-btn active" onclick="setRegionFilter('All', this)">All</button>
          <button class="filter-btn region-btn" onclick="setRegionFilter('North', this)">North</button>
          <button class="filter-btn region-btn" onclick="setRegionFilter('South', this)">South</button>
          <button class="filter-btn region-btn" onclick="setRegionFilter('East', this)">East</button>
          <button class="filter-btn region-btn" onclick="setRegionFilter('West', this)">West</button>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-group">
          <span class="filter-group-label">Month</span>
          <button class="filter-btn month-btn active" onclick="setMonthFilter('All', this)">All</button>
          <button class="filter-btn month-btn" onclick="setMonthFilter('2025-11', this)">Nov</button>
          <button class="filter-btn month-btn" onclick="setMonthFilter('2025-12', this)">Dec</button>
          <button class="filter-btn month-btn" onclick="setMonthFilter('2026-01', this)">Jan</button>
          <button class="filter-btn month-btn" onclick="setMonthFilter('2026-02', this)">Feb</button>
          <button class="filter-btn month-btn" onclick="setMonthFilter('2026-03', this)">Mar</button>
        </div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-dollar-sign"></i></div>
          <div class="kpi-label">Total Revenue <i class="fas fa-info-circle kpi-info" title="Total revenue across all filtered records"></i></div>
        </div>
        <div class="kpi-value" id="kpi-revenue"><span class="skeleton" style="width:120px;height:28px;">&nbsp;</span></div>
        <div class="kpi-sub" id="kpi-revenue-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-boxes-stacked"></i></div>
          <div class="kpi-label">Total Units Sold <i class="fas fa-info-circle kpi-info" title="Number of units sold in the selected period"></i></div>
        </div>
        <div class="kpi-value" id="kpi-units"><span class="skeleton" style="width:100px;height:28px;">&nbsp;</span></div>
        <div class="kpi-sub" id="kpi-units-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-tag"></i></div>
          <div class="kpi-label">Avg Price Per Unit <i class="fas fa-info-circle kpi-info" title="Average revenue per unit (Total Revenue / Total Units)"></i></div>
        </div>
        <div class="kpi-value" id="kpi-price"><span class="skeleton" style="width:80px;height:28px;">&nbsp;</span></div>
        <div class="kpi-sub" id="kpi-price-sub"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-rotate-left"></i></div>
          <div class="kpi-label">Avg Return Rate <i class="fas fa-info-circle kpi-info" title="Average product return rate across all records"></i></div>
        </div>
        <div class="kpi-value" id="kpi-return"><span class="skeleton" style="width:60px;height:28px;">&nbsp;</span></div>
        <div class="kpi-sub" id="kpi-return-sub"></div>
      </div>
    </div>

    <div class="chart-card full-width">
      <div class="chart-card-title">Revenue by Region</div>
      <div class="chart-container tall" id="chart-grouped-bar"></div>
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-card-title">Product Ranking by Revenue</div>
        <div class="chart-container" id="chart-hbar"></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Region Revenue Share</div>
        <div class="chart-container" id="chart-donut"></div>
      </div>
    </div>

    <div class="chart-card full-width">
      <div class="chart-card-title">Monthly Revenue Trend by Region</div>
      <div class="chart-container tall" id="chart-trend"></div>
    </div>

    <div class="data-table-wrapper full-width">
      <div class="table-toolbar">
        <div class="chart-card-title">Detail Table</div>
        <div class="table-actions">
          <input type="text" placeholder="Search..." class="table-search" oninput="filterTableSearch(this.value)">
          <button class="filter-btn" onclick="exportCSV()"><i class="fas fa-download"></i> Export</button>
        </div>
      </div>
      <table class="data-table" id="detail-table">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Month <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(1)">Region <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(2)">Product <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(3)">Units Sold <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(4)">Revenue <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(5)">Return Rate <i class="sort-icon fas fa-sort"></i></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div class="table-pagination" id="table-pagination"></div>
    </div>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon"></i>
  </button>

    // ── Constants ──
    const SERIES_COLORS = [
      '#818cf8', '#fbbf24', '#34d399', '#fb7185',
      '#60a5fa', '#a78bfa', '#f472b6', '#2dd4bf',
      '#fb923c', '#22d3ee', '#a3e635', '#c084fc',

    ];

    const REGIONS = ['North','South','East','West'];
    const PRODUCTS = ['Laptop Pro','Phone X','Tablet Air','Headphones Elite','Smart Watch','Camera Zoom'];
    const MONTHS = ['2025-11','2025-12','2026-01','2026-02','2026-03'];

    // ── State ──
    let currentRegion = 'All';
    let currentMonth = 'All';
    let tableDataArr = [];
    let tablePage = 1;
    const PAGE_SIZE = 15;
    let tableSearchQuery = '';

    // ── Theme ──
    function getChartThemeColors() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return {
        textColor:      isDark ? '#cbd5e1' : '#64748b',
        axisLineColor:  isDark ? '#475569' : '#e2e8f0',
        splitLineColor: isDark ? 'rgba(71,85,105,0.4)' : '#f1f5f9',
        backgroundColor: isDark ? '#1e293b' : '#ffffff',
      };
    }

    function initTheme() {
      const saved = localStorage.getItem('dashboard-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateToggleIcon();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('dashboard-theme', next);
      updateToggleIcon();
    }

    function updateToggleIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerHTML = isDark
        ? '<i class="fas fa-sun"></i>'
        : '<i class="fas fa-moon"></i>';
    }

    // ── Chart Instances ──
    let chartGroupedBar, chartHBar, chartDonut, chartTrend;

    function initChart(containerId) {
      const el = document.getElementById(containerId);
      if (!el) return null;
      const chart = echarts.init(el);
      window.addEventListener('resize', () => chart.resize());
      return chart;
    }

    // ── Formatting Helpers ──
    function fmtCurrency(val) {
      if (val >= 1e6) return '$' + (val / 1e6).toFixed(2) + 'M';
      if (val >= 1e3) return '$' + (val / 1e3).toFixed(1) + 'K';
      return '$' + val.toFixed(2);
    }

    function fmtCurrencyFull(val) {
      return '$' + val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function fmtNumber(val) {
      return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function fmtPercent(val) {
      return (val * 100).toFixed(1) + '%';
    }

    // ── CountUp Animation ──
    function animateValue(el, end, formatter, duration = 800) {
      const start = 0;
      const range = end - start;
      const startTime = performance.now();
      function step(timestamp) {
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
        el.textContent = formatter(start + range * eased);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // ── Filter Logic ──
    function getFilteredData() {
      let filtered = DATA;
      if (currentRegion !== 'All') filtered = filtered.filter(d => d.region === currentRegion);
      if (currentMonth !== 'All') filtered = filtered.filter(d => d.month === currentMonth);
      return filtered;
    }

    function setRegionFilter(region, btn) {
      currentRegion = region;
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function setMonthFilter(month, btn) {
      currentMonth = month;
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const filtered = getFilteredData();
      renderKPIs(filtered);
      renderGroupedBar(filtered);
      renderHBar(filtered);
      renderDonut(filtered);
      renderTrend(filtered);
      renderTable(filtered);
      updateSubtitle(filtered);
    }

    // ── Subtitle ──
    function updateSubtitle(data) {
      const now = new Date();
      const updated = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const regionLabel = currentRegion === 'All' ? 'All Regions' : currentRegion;
      const monthLabel = currentMonth === 'All' ? 'All Months' : currentMonth;
      document.getElementById('dashboard-subtitle').textContent =
        'Last updated: ' + updated + ' \u00b7 ' + regionLabel + ' \u00b7 ' + monthLabel + ' \u00b7 ' + data.length + ' records';
    }

    // ── KPIs ──
    function renderKPIs(data) {
      const totalRevenue = data.reduce((s, d) => s + d.revenue, 0);
      const totalUnits = data.reduce((s, d) => s + d.units_sold, 0);
      const avgPrice = totalUnits > 0 ? totalRevenue / totalUnits : 0;
      const avgReturn = data.length > 0 ? data.reduce((s, d) => s + d.return_rate, 0) / data.length : 0;

      animateValue(document.getElementById('kpi-revenue'), totalRevenue, v => fmtCurrency(v));
      document.getElementById('kpi-revenue-sub').textContent = fmtCurrencyFull(totalRevenue);

      animateValue(document.getElementById('kpi-units'), totalUnits, v => fmtNumber(Math.round(v)));
      document.getElementById('kpi-units-sub').textContent = data.length + ' records';

      animateValue(document.getElementById('kpi-price'), avgPrice, v => '$' + v.toFixed(2));
      document.getElementById('kpi-price-sub').textContent = 'per unit average';

      animateValue(document.getElementById('kpi-return'), avgReturn * 100, v => v.toFixed(1) + '%');
      document.getElementById('kpi-return-sub').textContent = 'across all products';
    }

    // ── Grouped Bar Chart (X = regions, bars = products) ──
    function renderGroupedBar(data) {
      const theme = getChartThemeColors();
      const activeRegions = [...new Set(data.map(d => d.region))].sort((a, b) => REGIONS.indexOf(a) - REGIONS.indexOf(b));
      const activeProducts = [...new Set(data.map(d => d.product))].sort((a, b) => PRODUCTS.indexOf(a) - PRODUCTS.indexOf(b));

      const series = activeProducts.map((product, i) => {
        const values = activeRegions.map(region => {
          const sum = data.filter(d => d.region === region && d.product === product).reduce((s, d) => s + d.revenue, 0);
          return Math.round(sum * 100) / 100;
        });
        return {
          name: product,
          type: 'bar',
          data: values,
          itemStyle: { color: SERIES_COLORS[i] },
        };
      });

      chartGroupedBar.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: function(params) {
            let html = '<div style="font-weight:600;margin-bottom:4px">' + params[0].axisValue + '</div>';
            params.forEach(p => {
              html += '<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'
                + '<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + p.color + '"></span>'
                + '<span>' + p.seriesName + ': ' + fmtCurrencyFull(p.value) + '</span></div>';
            });
            return html;
          }
        },
        legend: {
          top: 5,
          textStyle: { fontSize: 12, color: theme.textColor },
        },
        grid: { left: 70, right: 20, top: 40, bottom: 30 },
        xAxis: {
          type: 'category',
          data: activeRegions,
          axisLabel: { fontSize: 12, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: {
          type: 'value',
          axisLabel: {
            color: theme.textColor,
            formatter: v => fmtCurrency(v),
          },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        series: series,
      }, true);
    }

    // ── Horizontal Bar (Product Ranking) ──
    function renderHBar(data) {
      const theme = getChartThemeColors();
      const productRevenue = {};
      data.forEach(d => {
        productRevenue[d.product] = (productRevenue[d.product] || 0) + d.revenue;
      });

      const sorted = Object.entries(productRevenue)
        .sort((a, b) => a[1] - b[1]);

      const labels = sorted.map(s => s[0]);
      const values = sorted.map(s => Math.round(s[1] * 100) / 100);

      chartHBar.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'shadow' },
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: function(params) {
            return params[0].name + ': ' + fmtCurrencyFull(params[0].value);
          }
        },
        grid: { left: 130, right: 60, top: 10, bottom: 30 },
        xAxis: {
          type: 'value',
          axisLabel: {
            color: theme.textColor,
            formatter: v => fmtCurrency(v),
          },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        yAxis: {
          type: 'category',
          data: labels,
          axisLabel: {
            fontSize: 11,
            width: 120,
            overflow: 'truncate',
            color: theme.textColor,
          },
        },
        series: [{
          type: 'bar',
          data: values.map((v, i) => ({
            value: v,
            itemStyle: { color: SERIES_COLORS[i] },
          })),
          barWidth: '60%',
          label: {
            show: true,
            position: 'right',
            fontSize: 10,
            color: theme.textColor,
            formatter: p => fmtCurrency(p.value),
          },
        }],
      }, true);
    }

    // ── Donut (Region Revenue Share) ──
    function renderDonut(data) {
      const theme = getChartThemeColors();
      const regionRevenue = {};
      data.forEach(d => {
        regionRevenue[d.region] = (regionRevenue[d.region] || 0) + d.revenue;
      });

      const items = Object.entries(regionRevenue)
        .sort((a, b) => REGIONS.indexOf(a[0]) - REGIONS.indexOf(b[0]))
        .map(([name, value]) => ({ name, value: Math.round(value * 100) / 100 }));

      chartDonut.setOption({
        tooltip: {
          trigger: 'item',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: p => p.name + ': ' + fmtCurrencyFull(p.value) + ' (' + p.percent.toFixed(1) + '%)',
        },
        legend: {
          orient: 'vertical',
          right: 10,
          top: 'center',
          textStyle: { fontSize: 11, color: theme.textColor },
        },
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          center: ['40%', '50%'],
          data: items.map((item, i) => ({
            name: item.name,
            value: item.value,
            itemStyle: { color: SERIES_COLORS[i] },
          })),
          label: {
            formatter: params => params.percent.toFixed(1) + '%',
            fontSize: 11,
            color: theme.textColor,
          },
          emphasis: {
            itemStyle: {
              shadowBlur: 8,
              shadowColor: 'rgba(0,0,0,0.2)',
            },
          },
        }],
      }, true);
    }

    // ── Trend Line (Monthly revenue per region) ──
    function renderTrend(data) {
      const theme = getChartThemeColors();
      const activeMonths = [...new Set(data.map(d => d.month))].sort();
      const activeRegions = [...new Set(data.map(d => d.region))].sort((a, b) => REGIONS.indexOf(a) - REGIONS.indexOf(b));

      const series = activeRegions.map((region, i) => {
        const values = activeMonths.map(month => {
          const sum = data.filter(d => d.region === region && d.month === month).reduce((s, d) => s + d.revenue, 0);
          return Math.round(sum * 100) / 100;
        });
        return {
          name: region,
          type: 'line',
          smooth: true,
          symbol: 'circle',
          symbolSize: 6,
          lineStyle: { width: 2 },
          itemStyle: { color: SERIES_COLORS[i] },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: SERIES_COLORS[i] + '40' },
              { offset: 1, color: SERIES_COLORS[i] + '05' },
            ]),
          },
          data: values,
        };
      });

      chartTrend.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },

              html += '<div style="display:flex;align-items:center;gap:6px;margin:2px 0">'

            return html;
          }

          top: 5,

        dataZoom: [
          { type: 'inside', start: 0, end: 100 },
          { type: 'slider', bottom: 5, height: 20, start: 0, end: 100,
            borderColor: theme.axisLineColor,
            textStyle: { color: theme.textColor },
          },
        ],
        xAxis: {
          type: 'category',
          data: activeMonths,
          axisLabel: { fontSize: 11, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: {
          type: 'value',
          name: 'Revenue',
          nameTextStyle: { color: theme.textColor },
          axisLabel: {
            color: theme.textColor,
            formatter: v => fmtCurrency(v),
          },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        series: series,
      }, true);
    }

    // ── Table ──
    let sortState = { column: -1, direction: 1 };

    function renderTable(data) {
      tableDataArr = data.slice();
      tablePage = 1;
      tableSearchQuery = '';
      const searchInput = document.querySelector('.table-search');
      if (searchInput) searchInput.value = '';
      sortState = { column: -1, direction: 1 };
      document.querySelectorAll('#detail-table th').forEach(th => {
        th.classList.remove('sorted');
        const icon = th.querySelector('.sort-icon');
        if (icon) icon.className = 'sort-icon fas fa-sort';
      });
      renderTablePage();
    }

    function getFilteredTableData() {
      if (!tableSearchQuery) return tableDataArr;
      const q = tableSearchQuery.toLowerCase();
      return tableDataArr.filter(d =>
        d.month.includes(q) ||
        d.region.toLowerCase().includes(q) ||
        d.product.toLowerCase().includes(q) ||
        fmtCurrencyFull(d.revenue).toLowerCase().includes(q) ||
        String(d.units_sold).includes(q)
      );
    }

    function renderTablePage() {
      const data = getFilteredTableData();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      if (tablePage > totalPages) tablePage = totalPages;
      const start = (tablePage - 1) * PAGE_SIZE;
      const pageData = data.slice(start, start + PAGE_SIZE);

      // Compute min/max revenue for conditional heat formatting
      const allRevs = data.map(d => d.revenue);
      const maxRev = Math.max(...allRevs);
      const minRev = Math.min(...allRevs);
      const revRange = maxRev - minRev || 1;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      pageData.forEach(d => {
        const tr = document.createElement('tr');
        const normalized = (d.revenue - minRev) / revRange;
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const heatBg = isDark
          ? 'rgba(52, 211, 153, ' + (normalized * 0.25) + ')'
          : 'rgba(74, 222, 128, ' + (normalized * 0.2) + ')';
        tr.innerHTML =
          '<td data-value="' + d.month + '">' + d.month + '</td>' +
          '<td data-value="' + d.region + '">' + d.region + '</td>' +
          '<td data-value="' + d.product + '">' + d.product + '</td>' +
          '<td data-value="' + d.units_sold + '">' + fmtNumber(d.units_sold) + '</td>' +
          '<td data-value="' + d.revenue + '" style="background:' + heatBg + '">' + fmtCurrencyFull(d.revenue) + '</td>' +
          '<td data-value="' + d.return_rate + '">' + fmtPercent(d.return_rate) + '</td>';

        // Row click → markLine on grouped bar chart
        tr.addEventListener('click', function() {
          document.querySelectorAll('#detail-table tbody tr').forEach(r => r.classList.remove('row-selected'));
          tr.classList.add('row-selected');
          if (chartGroupedBar) {
            chartGroupedBar.dispatchAction({ type: 'highlight', name: d.product });
            setTimeout(() => {
              chartGroupedBar.dispatchAction({ type: 'downplay', name: d.product });
            }, 2000);
          }
        });

        tbody.appendChild(tr);
      });

      // Pagination controls
      const paginationEl = document.getElementById('table-pagination');
      if (totalPages <= 1) {
        paginationEl.innerHTML = '';
        return;
      }
      paginationEl.innerHTML =
        '<button onclick="changePage(-1)"' + (tablePage <= 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i> Prev</button>' +
        '<span>Page ' + tablePage + ' of ' + totalPages + '</span>' +
        '<button onclick="changePage(1)"' + (tablePage >= totalPages ? ' disabled' : '') + '>Next <i class="fas fa-chevron-right"></i></button>';
    }

    function changePage(delta) {
      const data = getFilteredTableData();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      tablePage = Math.max(1, Math.min(totalPages, tablePage + delta));
      renderTablePage();
    }

    function filterTableSearch(query) {
      tableSearchQuery = query;
      tablePage = 1;
      renderTablePage();
    }

    function exportCSV() {
      const data = getFilteredTableData();
      let csv = 'Month,Region,Product,Units Sold,Revenue,Return Rate\n';
      data.forEach(d => {
        csv += d.month + ',' + d.region + ',' + d.product + ',' + d.units_sold + ',' + d.revenue.toFixed(2) + ',' + fmtPercent(d.return_rate) + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'sales_comparison_data.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function sortTable(columnIndex) {
      const fields = ['month', 'region', 'product', 'units_sold', 'revenue', 'return_rate'];
      if (sortState.column === columnIndex) {
        sortState.direction *= -1;
      } else {
        sortState.column = columnIndex;
        sortState.direction = 1;
      }
      const field = fields[columnIndex];
      tableDataArr.sort((a, b) => {
        const va = a[field], vb = b[field];
        if (typeof va === 'string') return sortState.direction * va.localeCompare(vb);
        return sortState.direction * (va - vb);
      });
      updateSortIcons(columnIndex);
      renderTablePage();
    }

    function updateSortIcons(activeCol) {
      document.querySelectorAll('#detail-table th').forEach((th, i) => {
        th.classList.toggle('sorted', i === activeCol);
        const icon = th.querySelector('.sort-icon');
        if (icon) {
          icon.className = 'sort-icon fas ' +
            (i === activeCol
              ? (sortState.direction === 1 ? 'fa-sort-up' : 'fa-sort-down')
              : 'fa-sort');
        }
      });
    }

    // ── Re-render all charts on theme change ──
    function updateAllCharts() {
      applyFilters();
    }

    const observer = new MutationObserver(() => updateAllCharts());
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    // ── Initialize ──
    initTheme();

    chartGroupedBar = initChart('chart-grouped-bar');
    chartHBar = initChart('chart-hbar');
    chartDonut = initChart('chart-donut');
    chartTrend = initChart('chart-trend');

    applyFilters();
  </script>
</body>
</html>

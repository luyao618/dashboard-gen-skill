<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Sales Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #4f6ef7;
      --accent-light: #e8ecff;
      --accent-dark: #3b52c7;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #f87171;
      --info: #60a5fa;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
      --transition: .2s ease;
    }

    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --accent-light: #1e3a5f;
      --border: #475569;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-primary);
      margin: 0;
      padding: 20px 24px;
      min-height: 100vh;
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dashboard-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      border-left: 4px solid var(--kpi-color, var(--accent));
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(129, 140, 248, 0.15);
    }

    .kpi-card:nth-child(1) { --kpi-color: #818cf8; }
    .kpi-card:nth-child(2) { --kpi-color: #fbbf24; }
    .kpi-card:nth-child(3) { --kpi-color: #34d399; }
    .kpi-card:nth-child(4) { --kpi-color: #fb7185; }

    .kpi-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .kpi-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #fff;
      background: var(--kpi-color, var(--accent));
      flex-shrink: 0;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .kpi-change {
      font-size: 12px;
      font-weight: 600;
    }

    .kpi-change.positive { color: var(--success); }
    .kpi-change.negative { color: var(--danger); }

    .kpi-sparkline {
      width: 100%;
      height: 40px;
      margin-top: 8px;
    }

    .chart-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .chart-card {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition);
    }

    .chart-card:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .chart-card.full-width {
      width: 100%;
    }

    .chart-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .chart-container {
      width: 100%;
      height: 300px;
    }

    .data-table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .data-table-wrapper .chart-card-title {
      margin-bottom: 12px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .data-table th:hover {
      color: var(--accent);
    }

    .data-table th .sort-icon {
      margin-left: 4px;
      font-size: 10px;
      opacity: 0.4;
    }

    .data-table th.sorted .sort-icon {
      opacity: 1;
      color: var(--accent);
    }

    .data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    .data-table tbody tr:hover {
      background: var(--accent-light);
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      z-index: 1000;
    }

    .theme-toggle:hover {
      box-shadow: var(--shadow-lg);
      transform: scale(1.05);
    }

    /* ── Accent bar at top ── */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #818cf8, #4ade80, #fbbf24, #f87171);
      z-index: 9999;
    }

    /* ── Skeleton loading animation ── */
    .skeleton {
      background: linear-gradient(90deg, var(--border) 25%, var(--bg-primary) 50%, var(--border) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 4px;
      display: inline-block;
    }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* ── KPI info tooltip ── */
    .kpi-info {
      opacity: 0.4;
      font-size: 10px;
      margin-left: 4px;
      cursor: help;
    }
    .kpi-info:hover { opacity: 0.8; }

    /* ── Dashboard subtitle ── */
    .dashboard-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ── Category filter ── */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 2px;
    }
    .filter-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 8px;
    }

    /* ── Table toolbar (search + export) ── */
    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .table-search {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
      width: 200px;
    }
    .table-search:focus {
      border-color: var(--accent);
    }
    .table-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Table pagination ── */
    .table-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .table-pagination button {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition);
    }
    .table-pagination button:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }
    .table-pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Table row click highlight ── */
    .data-table tbody tr {
      cursor: pointer;
      transition: background var(--transition);
    }
    .data-table tbody tr.row-selected {
      background: var(--accent-light) !important;
    }

    @media (max-width: 1024px) {
      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .chart-row {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }
      body {
        padding: 12px;
      }
      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .filter-bar {
        flex-wrap: wrap;
      }
      .filter-divider { display: none; }
      .kpi-sparkline { display: none; }
      .table-search { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div class="dashboard-header">
      <div>
        <h1 class="dashboard-title">E-Commerce Sales Dashboard</h1>
        <p class="dashboard-subtitle" id="dashboard-subtitle">Loading data...</p>
      </div>
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-group-label">Period</span>
          <button class="filter-btn time-btn" onclick="setDateRange(7, this)">7d</button>
          <button class="filter-btn time-btn" onclick="setDateRange(14, this)">14d</button>
          <button class="filter-btn time-btn active" onclick="setDateRange(30, this)">30d</button>
          <button class="filter-btn time-btn" onclick="setDateRange(60, this)">60d</button>
          <button class="filter-btn time-btn" onclick="setDateRange(90, this)">90d</button>
        </div>
        <div class="filter-divider"></div>
        <div class="filter-group">
          <span class="filter-group-label">Category</span>
          <button class="filter-btn cat-btn active" onclick="setCategoryFilter('all', this)">All</button>
          <button class="filter-btn cat-btn" onclick="setCategoryFilter('Electronics', this)">Electronics</button>
          <button class="filter-btn cat-btn" onclick="setCategoryFilter('Clothing', this)">Clothing</button>
          <button class="filter-btn cat-btn" onclick="setCategoryFilter('Home & Garden', this)">Home & Garden</button>
          <button class="filter-btn cat-btn" onclick="setCategoryFilter('Sports', this)">Sports</button>
        </div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-dollar-sign"></i></div>
          <div class="kpi-label">Total Revenue <i class="fas fa-info-circle kpi-info" title="Total revenue across all categories in the selected period"></i></div>
        </div>
        <div class="kpi-value" id="kpi-revenue"><span class="skeleton" style="width:120px;height:28px;">&nbsp;</span></div>
        <div class="kpi-change" id="kpi-revenue-change"><span class="skeleton" style="width:140px;height:14px;">&nbsp;</span></div>
        <div class="kpi-sparkline" id="spark-revenue"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-shopping-cart"></i></div>
          <div class="kpi-label">Total Orders <i class="fas fa-info-circle kpi-info" title="Number of completed orders in the selected period"></i></div>
        </div>
        <div class="kpi-value" id="kpi-orders"><span class="skeleton" style="width:100px;height:28px;">&nbsp;</span></div>
        <div class="kpi-change" id="kpi-orders-change"><span class="skeleton" style="width:140px;height:14px;">&nbsp;</span></div>
        <div class="kpi-sparkline" id="spark-orders"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-chart-bar"></i></div>
          <div class="kpi-label">Avg Order Value <i class="fas fa-info-circle kpi-info" title="Average revenue per order (Total Revenue / Total Orders)"></i></div>
        </div>
        <div class="kpi-value" id="kpi-aov"><span class="skeleton" style="width:80px;height:28px;">&nbsp;</span></div>
        <div class="kpi-change" id="kpi-aov-change"><span class="skeleton" style="width:140px;height:14px;">&nbsp;</span></div>
        <div class="kpi-sparkline" id="spark-aov"></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-header">
          <div class="kpi-icon"><i class="fas fa-chart-line"></i></div>
          <div class="kpi-label">Conversion Rate <i class="fas fa-info-circle kpi-info" title="Percentage of visitors who placed an order"></i></div>
        </div>
        <div class="kpi-value" id="kpi-conv"><span class="skeleton" style="width:60px;height:28px;">&nbsp;</span></div>
        <div class="kpi-change" id="kpi-conv-change"><span class="skeleton" style="width:140px;height:14px;">&nbsp;</span></div>
        <div class="kpi-sparkline" id="spark-conv"></div>
      </div>
    </div>

    <div class="chart-row" style="margin-bottom: 20px;">
      <div class="chart-card full-width">
        <div class="chart-card-title">Revenue & Orders Trend</div>
        <div class="chart-container" id="chart-dual"></div>
      </div>
    </div>

    <div class="chart-row">
      <div class="chart-card">
        <div class="chart-card-title">Revenue by Category</div>
        <div class="chart-container" id="chart-donut"></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Daily Revenue by Category</div>
        <div class="chart-container" id="chart-stacked"></div>
      </div>
    </div>

    <div class="data-table-wrapper">
      <div class="table-toolbar">
        <div class="chart-card-title">Daily Data</div>
        <div class="table-actions">
          <input type="text" placeholder="Search..." class="table-search" oninput="filterTableSearch(this.value)">
          <button class="filter-btn" onclick="exportCSV()"><i class="fas fa-download"></i> Export</button>
        </div>
      </div>
      <table class="data-table" id="data-table">
        <thead>
          <tr>
            <th onclick="sortTable(0)">Date <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(1)">Revenue <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(2)">Orders <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(3)">Avg Order Value <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(4)">Conv. Rate <i class="sort-icon fas fa-sort"></i></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="table-pagination" id="table-pagination"></div>
    </div>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon"></i>
  </button>

    // ── Constants ──
    const SERIES_COLORS = [
      '#818cf8', // Indigo - Electronics
      '#fbbf24', // Amber - Clothing
      '#34d399', // Emerald - Home & Garden
      '#fb7185', // Rose - Sports
      '#60a5fa', '#a78bfa', '#f472b6', '#2dd4bf',
      '#fb923c', '#22d3ee', '#a3e635', '#c084fc',
      '#f87171', '#38bdf8', '#facc15', '#e879f9',
      '#4ade80', '#94a3b8', '#fda4af', '#67e8f9',
    ];

    const CATEGORIES = ['Electronics', 'Clothing', 'Home & Garden', 'Sports'];

    // ── Data Processing Helpers ──
    function getUniqueDates(data) {
      return [...new Set(data.map(d => d.date))].sort();
    }

    function aggregateByDate(data) {
      const map = {};
      data.forEach(r => {
        if (!map[r.date]) {
          map[r.date] = { date: r.date, revenue: 0, orders: 0, visitors: 0, catRevenue: {}, catOrders: {} };
          CATEGORIES.forEach(c => { map[r.date].catRevenue[c] = 0; map[r.date].catOrders[c] = 0; });
        }
        map[r.date].revenue += r.revenue;
        map[r.date].orders += r.orders;
        map[r.date].visitors += r.visitors;
        map[r.date].catRevenue[r.category] = (map[r.date].catRevenue[r.category] || 0) + r.revenue;
        map[r.date].catOrders[r.category] = (map[r.date].catOrders[r.category] || 0) + r.orders;
      });
      return Object.values(map).sort((a, b) => a.date.localeCompare(b.date));
    }

    function getChartThemeColors() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return {
        textColor:      isDark ? '#cbd5e1' : '#64748b',
        axisLineColor:  isDark ? '#475569' : '#e2e8f0',
        splitLineColor: isDark ? 'rgba(71,85,105,0.4)' : '#f1f5f9',
        backgroundColor: isDark ? '#1e293b' : '#ffffff',
      };
    }

    function getSparklineColors() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return isDark
        ? { lineColor: '#60a5fa', areaColor: 'rgba(96,165,250,0.15)' }
        : { lineColor: '#2d4a6e', areaColor: 'rgba(45,74,110,0.10)' };
    }

    // ── State ──
    let currentDays = 30;
    let currentCategory = 'all';
    let sparkCharts = {};
    let mainCharts = {};
    let tableData = [];
    let tablePage = 1;
    const PAGE_SIZE = 15;
    let tableSearchQuery = '';
    let selectedDate = null;

    // ── Theme ──
    function initTheme() {
      const saved = localStorage.getItem('dashboard-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateToggleIcon();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('dashboard-theme', next);
      updateToggleIcon();
    }

    function updateToggleIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    // ── Chart Initialization ──
    function initChart(id) {
      const el = document.getElementById(id);
      if (!el) return null;
      const chart = echarts.init(el);
      window.addEventListener('resize', () => chart.resize());
      return chart;
    }

    // ── Date & Category Filtering ──
    function filterData(days) {
      const dates = getUniqueDates(RAW_DATA);
      const maxDate = new Date(dates[dates.length - 1]);
      const cutoff = new Date(maxDate);
      cutoff.setDate(cutoff.getDate() - days + 1);
      let filtered = RAW_DATA.filter(r => new Date(r.date) >= cutoff);
      if (currentCategory !== 'all') {
        filtered = filtered.filter(r => r.category === currentCategory);
      }
      return filtered;
    }

    function setDateRange(days, btn) {
      currentDays = days;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    function setCategoryFilter(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAll();
    }

    // ── Format Helpers ──
    function fmtCurrency(v) {
      if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
      if (v >= 1e3) return '$' + (v / 1e3).toFixed(1) + 'K';
      return '$' + v.toFixed(0);
    }

    function fmtNumber(v) {
      return v.toLocaleString('en-US');
    }

    function fmtPct(v) {
      return v.toFixed(1) + '%';
    }

    function fmtDate(d) {
      const parts = d.split('-');
      return parts[1] + '/' + parts[2];
    }

    // ── CountUp Animation ──
    function animateValue(el, end, formatter, duration = 800) {
      const start = 0;
      const range = end - start;
      const startTime = performance.now();
      function step(timestamp) {
        const progress = Math.min((timestamp - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
        el.textContent = formatter(start + range * eased);
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // ── KPI Rendering ──
    function renderKPIs(filteredData) {
      const agg = aggregateByDate(filteredData);
      const totalRev = agg.reduce((s, d) => s + d.revenue, 0);
      const totalOrd = agg.reduce((s, d) => s + d.orders, 0);
      const avgAOV = totalOrd > 0 ? totalRev / totalOrd : 0;

      // Weighted avg conversion: total orders / total visitors * 100
      const totalVisitors = agg.reduce((s, d) => s + d.visitors, 0);
      const convRate = totalVisitors > 0 ? (totalOrd / totalVisitors) * 100 : 0;

      // Week-over-week change
      const halfLen = Math.floor(agg.length / 2);
      const recentHalf = agg.slice(halfLen);
      const priorHalf = agg.slice(0, halfLen);

      function sumField(arr, field) { return arr.reduce((s, d) => s + d[field], 0); }

      const recentRev = sumField(recentHalf, 'revenue');
      const priorRev = sumField(priorHalf, 'revenue');
      const revChange = priorRev > 0 ? ((recentRev - priorRev) / priorRev) * 100 : 0;

      const recentOrd = sumField(recentHalf, 'orders');
      const priorOrd = sumField(priorHalf, 'orders');
      const ordChange = priorOrd > 0 ? ((recentOrd - priorOrd) / priorOrd) * 100 : 0;

      const recentAOV = recentOrd > 0 ? recentRev / recentOrd : 0;
      const priorAOV = priorOrd > 0 ? priorRev / priorOrd : 0;
      const aovChange = priorAOV > 0 ? ((recentAOV - priorAOV) / priorAOV) * 100 : 0;

      const recentVis = sumField(recentHalf, 'visitors');
      const priorVis = sumField(priorHalf, 'visitors');
      const recentConv = recentVis > 0 ? (recentOrd / recentVis) * 100 : 0;
      const priorConv = priorVis > 0 ? (priorOrd / priorVis) * 100 : 0;
      const convChange = priorConv > 0 ? ((recentConv - priorConv) / priorConv) * 100 : 0;

      // Update DOM with countUp animation
      animateValue(document.getElementById('kpi-revenue'), totalRev, v => fmtCurrency(v));
      animateValue(document.getElementById('kpi-orders'), totalOrd, v => fmtNumber(Math.round(v)));
      animateValue(document.getElementById('kpi-aov'), avgAOV, v => '$' + Math.round(v));
      animateValue(document.getElementById('kpi-conv'), convRate, v => fmtPct(v));

      setChange('kpi-revenue-change', revChange);
      setChange('kpi-orders-change', ordChange);
      setChange('kpi-aov-change', aovChange);
      setChange('kpi-conv-change', convChange);

      // Sparklines (last 30 data points or all if fewer)
      const sparkData = agg.slice(-30);
      const sparkDates = sparkData.map(d => d.date);

      renderSparkline('spark-revenue', sparkDates, sparkData.map(d => d.revenue));
      renderSparkline('spark-orders', sparkDates, sparkData.map(d => d.orders));
      renderSparkline('spark-aov', sparkDates, sparkData.map(d => d.orders > 0 ? d.revenue / d.orders : 0));
      renderSparkline('spark-conv', sparkDates, sparkData.map(d => d.visitors > 0 ? (d.orders / d.visitors) * 100 : 0));
    }

    function setChange(id, pct) {
      const el = document.getElementById(id);
      const isPos = pct >= 0;
      el.className = 'kpi-change ' + (isPos ? 'positive' : 'negative');
      el.innerHTML = (isPos ? '<i class="fas fa-arrow-up"></i> +' : '<i class="fas fa-arrow-down"></i> ') + Math.abs(pct).toFixed(1) + '% vs prior period';
    }

    function renderSparkline(id, dates, values) {
      if (!sparkCharts[id]) {
        sparkCharts[id] = initChart(id);
      }
      const chart = sparkCharts[id];
      if (!chart) return;
      const colors = getSparklineColors();
      chart.setOption({
        animation: false,
        grid: { left: 0, right: 0, top: 2, bottom: 2 },
        xAxis: { type: 'category', show: false, data: dates },
        yAxis: { type: 'value', show: false },
        series: [{
          type: 'line',
          data: values,
          symbol: 'none',
          smooth: true,
          lineStyle: { color: colors.lineColor, width: 2 },
          areaStyle: { color: colors.areaColor },
        }],
      }, true);
    }

    // ── Charts Rendering ──
    function renderCharts(filteredData) {
      const agg = aggregateByDate(filteredData);
      const dates = agg.map(d => fmtDate(d.date));

      renderDualAxisChart(agg, dates);
      renderDonutChart(filteredData);
      renderStackedAreaChart(agg, dates);
    }

    function renderDualAxisChart(agg, dates) {
      if (!mainCharts.dual) mainCharts.dual = initChart('chart-dual');
      const chart = mainCharts.dual;
      if (!chart) return;
      const theme = getChartThemeColors();

      // Build prior period comparison data
      const halfLen = Math.floor(agg.length / 2);
      const priorRevData = [];
      for (let i = 0; i < agg.length; i++) {
        if (i < halfLen) {
          priorRevData.push(null);
        } else {
          priorRevData.push(agg[i - halfLen] ? agg[i - halfLen].revenue : null);
        }
      }

      // Build rolling 7-day average for revenue
      const revenueArr = agg.map(d => d.revenue);
      const rolling7 = revenueArr.map((_, i) => {
        if (i < 6) return null;
        let sum = 0;
        for (let j = i - 6; j <= i; j++) sum += revenueArr[j];
        return Math.round(sum / 7 * 100) / 100;
      });

      chart.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: function(params) {
            let html = '<strong>' + params[0].axisValue + '</strong><br/>';
            params.forEach(p => {
              if (p.value == null) return;
              html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + p.color + ';margin-right:6px;"></span>';
              if (p.seriesName === 'Revenue' || p.seriesName === 'Revenue (Prior Period)' || p.seriesName === 'Revenue (7d Avg)') {
                html += p.seriesName + ': ' + fmtCurrency(p.value) + '<br/>';
              } else {
                html += p.seriesName + ': ' + fmtNumber(p.value) + '<br/>';
              }
            });
            return html;
          },
        },
        legend: {
          top: 5,
          textStyle: { fontSize: 12, color: theme.textColor },
        },
        grid: { left: 70, right: 70, top: 40, bottom: 60 },
        xAxis: {
          type: 'category',
          data: dates,
          axisLabel: { rotate: 30, fontSize: 10, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: [
          {
            type: 'value',
            name: 'Revenue ($)',
            nameTextStyle: { color: theme.textColor },
            axisLabel: { color: theme.textColor, formatter: v => fmtCurrency(v) },
            splitLine: { lineStyle: { color: theme.splitLineColor } },
          },
          {
            type: 'value',
            name: 'Orders',
            nameTextStyle: { color: theme.textColor },
            axisLabel: { color: theme.textColor },
            splitLine: { show: false },
          },
        ],
        dataZoom: [
          { type: 'inside', start: 0, end: 100 },
          { type: 'slider', bottom: 5, height: 20, start: 0, end: 100,
            borderColor: theme.axisLineColor,
            textStyle: { color: theme.textColor },
          },
        ],
        series: [
          {
            name: 'Revenue',
            type: 'line',
            yAxisIndex: 0,
            smooth: true,
            symbol: 'circle',
            symbolSize: 4,
            lineStyle: { width: 2 },
            itemStyle: { color: SERIES_COLORS[0] },
            areaStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: 'rgba(129, 140, 248, 0.3)' },
                { offset: 1, color: 'rgba(129, 140, 248, 0.02)' },
              ]),
            },
            data: agg.map(d => d.revenue),
          },
          {
            name: 'Revenue (Prior Period)',
            type: 'line',
            yAxisIndex: 0,
            smooth: true,
            symbol: 'none',
            lineStyle: { type: 'dashed', width: 1, color: '#cbd5e1' },
            itemStyle: { color: '#cbd5e1' },
            data: priorRevData,
          },
          {
            name: 'Revenue (7d Avg)',
            type: 'line',
            yAxisIndex: 0,
            smooth: true,
            symbol: 'none',
             lineStyle: { width: 2.5, color: '#fbbf24' },
             itemStyle: { color: '#fbbf24' },
            data: rolling7,
          },
          {
            name: 'Orders',
            type: 'line',
            yAxisIndex: 1,
            smooth: true,
            symbol: 'circle',
            symbolSize: 4,
            lineStyle: { width: 2 },
            itemStyle: { color: SERIES_COLORS[2] },
            data: agg.map(d => d.orders),
          },
        ],
      }, true);
    }

    function renderDonutChart(filteredData) {
      if (!mainCharts.donut) mainCharts.donut = initChart('chart-donut');
      const chart = mainCharts.donut;
      if (!chart) return;
      const theme = getChartThemeColors();

      const catRevs = {};
      CATEGORIES.forEach(c => { catRevs[c] = 0; });
      filteredData.forEach(r => { catRevs[r.category] += r.revenue; });

      const items = CATEGORIES.map((c, i) => ({
        name: c,
        value: Math.round(catRevs[c] * 100) / 100,
        itemStyle: { color: SERIES_COLORS[i] },
      }));

      chart.setOption({
        tooltip: {
          trigger: 'item',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: p => p.name + ': ' + fmtCurrency(p.value) + ' (' + p.percent.toFixed(1) + '%)',
        },
        legend: {
          orient: 'vertical',
          right: 10,
          top: 'center',
          textStyle: { fontSize: 11, color: theme.textColor },
        },
        series: [{
          type: 'pie',
          radius: ['40%', '70%'],
          center: ['40%', '50%'],
          data: items,
          label: {
            formatter: p => p.percent.toFixed(1) + '%',
            fontSize: 11,
            color: theme.textColor,
          },
          emphasis: {
            itemStyle: {
              shadowBlur: 8,
              shadowColor: 'rgba(0,0,0,0.2)',
            },
          },
        }],
      }, true);

      // Chart linking: click donut → highlight category in stacked chart
      chart.off('click');
      chart.on('click', function(params) {
        if (mainCharts.stacked) {
          const catIndex = CATEGORIES.indexOf(params.name);
          if (catIndex >= 0) {
            mainCharts.stacked.dispatchAction({ type: 'highlight', seriesIndex: catIndex });
            setTimeout(() => {
              mainCharts.stacked.dispatchAction({ type: 'downplay', seriesIndex: catIndex });
            }, 2000);
          }
        }
      });
    }

    function renderStackedAreaChart(agg, dates) {
      if (!mainCharts.stacked) mainCharts.stacked = initChart('chart-stacked');
      const chart = mainCharts.stacked;
      if (!chart) return;
      const theme = getChartThemeColors();

      // Stacked area series
      const series = CATEGORIES.map((cat, i) => ({
        name: cat,
        type: 'line',
        stack: 'total',
        smooth: true,
        symbol: 'none',
        areaStyle: { opacity: 0.4 },
        lineStyle: { width: 2 },
        itemStyle: { color: SERIES_COLORS[i] },
        data: agg.map(d => d.catRevenue[cat] || 0),
      }));

      // Rolling 7-day average per category (stacked to match area chart)
      CATEGORIES.forEach((cat, i) => {
        const catData = agg.map(d => d.catRevenue[cat] || 0);
        const r7 = catData.map((_, idx) => {
          if (idx < 6) return null;
          let sum = 0;
          for (let j = idx - 6; j <= idx; j++) sum += catData[j];
          return Math.round(sum / 7 * 100) / 100;
        });
        series.push({
          name: cat + ' (7d Avg)',
          type: 'line',
          stack: 'avg',
          smooth: true,
          symbol: 'none',
          lineStyle: { width: 2, type: 'dashed', color: SERIES_COLORS[i] },
          itemStyle: { color: SERIES_COLORS[i] },
          areaStyle: { opacity: 0 },
          data: r7,
        });
      });

      chart.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: function(params) {
            let html = '<strong>' + params[0].axisValue + '</strong><br/>';
            let total = 0;
            params.forEach(p => {
              if (p.value == null) return;
              // Only sum stacked series (not the 7d avg lines)
              if (!p.seriesName.includes('7d Avg')) total += p.value;
              html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + p.color + ';margin-right:6px;"></span>';
              html += p.seriesName + ': ' + fmtCurrency(p.value) + '<br/>';
            });
            html += '<strong>Total: ' + fmtCurrency(total) + '</strong>';
            return html;
          },
        },
        legend: {
          top: 5,
          textStyle: { fontSize: 12, color: theme.textColor },
        },
        grid: { left: 65, right: 20, top: 36, bottom: 40 },
        xAxis: {
          type: 'category',
          data: dates,
          boundaryGap: false,
          axisLabel: { rotate: 30, fontSize: 10, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: {
          type: 'value',
          splitLine: { lineStyle: { color: theme.splitLineColor } },
          axisLabel: { color: theme.textColor, formatter: v => fmtCurrency(v) },
        },
        series: series,
      }, true);
    }

    // ── Table Rendering ──
    let sortState = { column: -1, direction: 1 };

    function renderTable(filteredData) {
      const agg = aggregateByDate(filteredData);
      tableData = agg.map(d => ({
        date: d.date,
        revenue: d.revenue,
        orders: d.orders,
        aov: d.orders > 0 ? d.revenue / d.orders : 0,
        conv: d.visitors > 0 ? (d.orders / d.visitors) * 100 : 0,
      }));
      tablePage = 1;
      tableSearchQuery = '';
      const searchInput = document.querySelector('.table-search');
      if (searchInput) searchInput.value = '';
      sortState = { column: -1, direction: 1 };
      document.querySelectorAll('#data-table th').forEach(th => {
        th.classList.remove('sorted');
        const icon = th.querySelector('.sort-icon');
        if (icon) icon.className = 'sort-icon fas fa-sort';
      });
      renderTablePage();
    }

    function getFilteredTableData() {
      if (!tableSearchQuery) return tableData;
      const q = tableSearchQuery.toLowerCase();
      return tableData.filter(d =>
        d.date.includes(q) ||
        fmtCurrency(d.revenue).toLowerCase().includes(q) ||
        String(d.orders).includes(q)
      );
    }

    function renderTablePage() {
      const data = getFilteredTableData();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      if (tablePage > totalPages) tablePage = totalPages;
      const start = (tablePage - 1) * PAGE_SIZE;
      const pageData = data.slice(start, start + PAGE_SIZE);

      // Compute min/max revenue for conditional formatting
      const allRevs = data.map(d => d.revenue);
      const maxRev = Math.max(...allRevs);
      const minRev = Math.min(...allRevs);
      const revRange = maxRev - minRev || 1;

      const tbody = document.querySelector('#data-table tbody');
      tbody.innerHTML = '';

      pageData.forEach(d => {
        const tr = document.createElement('tr');
        const normalized = (d.revenue - minRev) / revRange;
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const heatBg = isDark
          ? 'rgba(52, 211, 153, ' + (normalized * 0.25) + ')'
          : 'rgba(74, 222, 128, ' + (normalized * 0.2) + ')';
        tr.innerHTML =
          '<td data-value="' + d.date + '">' + d.date + '</td>' +
          '<td data-value="' + d.revenue.toFixed(2) + '" style="background:' + heatBg + '">' + fmtCurrency(d.revenue) + '</td>' +
          '<td data-value="' + d.orders + '">' + fmtNumber(d.orders) + '</td>' +
          '<td data-value="' + d.aov.toFixed(2) + '">$' + d.aov.toFixed(2) + '</td>' +
          '<td data-value="' + d.conv.toFixed(2) + '">' + d.conv.toFixed(2) + '%</td>';

        // Row click → markLine on dual axis chart
        tr.addEventListener('click', function() {
          document.querySelectorAll('#data-table tbody tr').forEach(r => r.classList.remove('row-selected'));
          tr.classList.add('row-selected');
          if (mainCharts.dual) {
            mainCharts.dual.setOption({
              series: [{
                markLine: {
                  silent: true,
                  symbol: 'none',
                  lineStyle: { color: '#fb7185', type: 'solid', width: 2 },
                  label: { formatter: d.date, fontSize: 10 },
                  data: [{ xAxis: fmtDate(d.date) }],
                },
              }],
            });
          }
        });

        tbody.appendChild(tr);
      });

      // Pagination controls
      const paginationEl = document.getElementById('table-pagination');
      if (totalPages <= 1) {
        paginationEl.innerHTML = '';
        return;
      }
      paginationEl.innerHTML =
        '<button onclick="changePage(-1)"' + (tablePage <= 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i> Prev</button>' +
        '<span>Page ' + tablePage + ' of ' + totalPages + '</span>' +
        '<button onclick="changePage(1)"' + (tablePage >= totalPages ? ' disabled' : '') + '>Next <i class="fas fa-chevron-right"></i></button>';
    }

    function changePage(delta) {
      const data = getFilteredTableData();
      const totalPages = Math.max(1, Math.ceil(data.length / PAGE_SIZE));
      tablePage = Math.max(1, Math.min(totalPages, tablePage + delta));
      renderTablePage();
    }

    function filterTableSearch(query) {
      tableSearchQuery = query;
      tablePage = 1;
      renderTablePage();
    }

    function exportCSV() {
      const data = getFilteredTableData();
      let csv = 'Date,Revenue,Orders,Avg Order Value,Conversion Rate\n';
      data.forEach(d => {
        csv += d.date + ',' + d.revenue.toFixed(2) + ',' + d.orders + ',' + d.aov.toFixed(2) + ',' + d.conv.toFixed(2) + '%\n';
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dashboard_data.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function sortTable(columnIndex) {
      const fields = ['date', 'revenue', 'orders', 'aov', 'conv'];
      if (sortState.column === columnIndex) {
        sortState.direction *= -1;
      } else {
        sortState.column = columnIndex;
        sortState.direction = 1;
      }
      const field = fields[columnIndex];
      tableData.sort((a, b) => {
        const va = a[field], vb = b[field];
        if (typeof va === 'string') return sortState.direction * va.localeCompare(vb);
        return sortState.direction * (va - vb);
      });
      updateSortIcons(columnIndex);
      renderTablePage();
    }

    function updateSortIcons(activeCol) {
      document.querySelectorAll('#data-table th').forEach((th, i) => {
        th.classList.toggle('sorted', i === activeCol);
        const icon = th.querySelector('.sort-icon');
        if (icon) {
          icon.className = 'sort-icon fas ' +
            (i === activeCol
              ? (sortState.direction === 1 ? 'fa-sort-up' : 'fa-sort-down')
              : 'fa-sort');
        }
      });
    }

    // ── Render All ──
    function renderAll() {
      const filtered = filterData(currentDays);
      renderKPIs(filtered);
      renderCharts(filtered);
      renderTable(filtered);

      // Update subtitle with data range
      const dates = getUniqueDates(filtered);
      if (dates.length > 0) {
        const first = dates[0];
        const last = dates[dates.length - 1];
        const now = new Date();
        const updated = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        const catLabel = currentCategory === 'all' ? 'All Categories' : currentCategory;
        document.getElementById('dashboard-subtitle').textContent =
          'Last updated: ' + updated + ' \u00b7 Data range: ' + first + ' \u2013 ' + last + ' \u00b7 ' + catLabel;
      }
    }

    // ── Theme Observer ──
    const observer = new MutationObserver(() => renderAll());
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    // ── Initialize ──
    initTheme();
    renderAll();
  </script>
</body>
</html>

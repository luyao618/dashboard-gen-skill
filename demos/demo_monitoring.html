<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Monitoring Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --accent: #4f6ef7;
      --accent-light: #e8ecff;
      --accent-dark: #3b52c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --border: #e2e8f0;
      --radius: 10px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.1);
      --transition: .2s ease;
    }

    :root[data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --accent-light: #1e3a5f;
      --border: #475569;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      padding: 20px 24px;
      background: var(--bg-primary);
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dashboard-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-btn {
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* KPI Cards */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }

    .kpi-card:hover {
      box-shadow: var(--shadow-md);
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .kpi-value-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .kpi-threshold {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .kpi-sparkline {
      width: 100%;
      height: 40px;
      margin-top: 8px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-success { background: rgba(34,197,94,0.1); color: #16a34a; }
    .badge-warning { background: rgba(245,158,11,0.1); color: #d97706; }
    .badge-danger  { background: rgba(239,68,68,0.1);  color: #dc2626; }
    .badge-info    { background: rgba(59,130,246,0.1);  color: #2563eb; }

    /* Chart Cards */
    .chart-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
    }

    .chart-card {
      flex: 1;
      min-width: 0;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }

    .chart-card.wide { flex: 2; }
    .chart-card.narrow { flex: 1; }

    .chart-card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .chart-container {
      width: 100%;
      height: 300px;
    }

    .full-width {
      width: 100%;
      margin-bottom: 20px;
    }

    /* Data Table */
    .data-table-wrapper {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      overflow-x: auto;
      margin-bottom: 20px;
    }

    .data-table-wrapper .chart-card-title {
      margin-bottom: 12px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      text-align: left;
      padding: 10px 12px;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .data-table th:hover {
      color: var(--accent);
    }

    .data-table th .sort-icon {
      margin-left: 4px;
      font-size: 10px;
      opacity: 0.4;
    }

    .data-table th.sorted .sort-icon {
      opacity: 1;
      color: var(--accent);
    }

    .data-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }

    .data-table tbody tr:hover {
      background: var(--accent-light);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      z-index: 1000;
    }

    .theme-toggle:hover {
      box-shadow: var(--shadow-lg);
      transform: scale(1.05);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .chart-row {
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }
      body {
        padding: 12px;
      }
    }
  </style>
</head>

    <div class="dashboard-header">
      <h1 class="dashboard-title">API Monitoring Dashboard</h1>
      <div class="filter-bar">
        <button class="filter-btn" onclick="filterByRange(1, this)">24h</button>
        <button class="filter-btn" onclick="filterByRange(7, this)">7d</button>
        <button class="filter-btn active" onclick="filterByRange(30, this)">30d</button>
      </div>

    <div class="chart-card full-width">

      <div class="chart-container" id="chart-latency"></div>
    </div>

        <div class="chart-container" id="chart-error-bar"></div>
      </div>
    </div>

      <div class="chart-container" id="chart-qps"></div>

            <th onclick="sortTable(5)">Error Rate (%) <i class="sort-icon fas fa-sort"></i></th>
            <th onclick="sortTable(6)">Avg QPS <i class="sort-icon fas fa-sort"></i></th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <button class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-moon"></i>
  </button>

    // ── Constants ──
    const SERIES_COLORS = [
      '#E53E3E','#DD6B20','#D69E2E','#38A169','#319795',
      '#3182CE','#5A67D8','#805AD5','#D53F8C','#718096',
      '#C05621','#2C7A7B','#2B6CB0','#6B46C1','#B7791F',
      '#2D3748','#4A5568','#B83280','#276749','#1A365D',
    ];

    // ── State ──
    let currentRange = 30;
    let sortState = { column: -1, direction: 1 };
    let charts = {};

    // ── Theme ──
    function getChartThemeColors() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return {
        textColor:      isDark ? '#cbd5e1' : '#64748b',
        axisLineColor:  isDark ? '#475569' : '#e2e8f0',
        splitLineColor: isDark ? 'rgba(71,85,105,0.4)' : '#f1f5f9',
        backgroundColor: isDark ? '#1e293b' : '#ffffff',
      };
    }

    function initTheme() {
      const saved = localStorage.getItem('dashboard-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      updateToggleIcon();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const current = root.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('dashboard-theme', next);
      updateToggleIcon();
    }

    function updateToggleIcon() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const btn = document.querySelector('.theme-toggle');
      if (btn) btn.innerHTML = isDark
        ? '<i class="fas fa-sun"></i>'
        : '<i class="fas fa-moon"></i>';
    }

    // ── Chart init helper ──
    function initChart(containerId) {
      const el = document.getElementById(containerId);
      if (!el) return null;
      const chart = echarts.init(el);
      window.addEventListener('resize', () => chart.resize());
      return chart;
    }

    // ── Data filtering ──
    function getFilteredDates() {
      const allDates = [...ALL_DATES];
      return allDates.slice(-currentRange);
    }

    function getFilteredLatencyTrend() {
      const dates = getFilteredDates();
      return LATENCY_TREND.filter(d => dates.includes(d.date));
    }

    function getFilteredDailyData() {
      const dates = getFilteredDates();
      return DAILY_DATA.filter(d => dates.includes(d.date));
    }

    function getFilteredQPS() {
      const offset = ALL_DATES.length - currentRange;
      const result = {};
      for (const ep of ENDPOINTS) {
        result[ep] = QPS_BY_ENDPOINT[ep].slice(offset);
      }
      return result;
    }

    // ── KPI rendering ──
    function computeKPIs(data) {
      const p50s = data.map(d => d.p50);
      const p95s = data.map(d => d.p95);
      const p99s = data.map(d => d.p99);
      const errs = data.map(d => d.error_rate);
      const qpss = data.map(d => d.qps);
      const avg = arr => arr.reduce((a,b) => a+b, 0) / arr.length;
      return {
        p50: avg(p50s),
        p95: avg(p95s),
        p99: avg(p99s),
        error_rate: avg(errs),
        qps: avg(qpss)
      };
    }

    function getP50Status(val) {
      if (val < 100) return { badge: 'badge-success', label: 'Good' };
      if (val < 200) return { badge: 'badge-warning', label: 'Warning' };
      return { badge: 'badge-danger', label: 'Critical' };
    }

    function getP95Status(val) {
      if (val < 200) return { badge: 'badge-success', label: 'Good' };
      if (val < 500) return { badge: 'badge-warning', label: 'Warning' };
      return { badge: 'badge-danger', label: 'Critical' };
    }

    function getErrStatus(val) {
      if (val < 1) return { badge: 'badge-success', label: 'Good' };
      if (val < 5) return { badge: 'badge-warning', label: 'Warning' };
      return { badge: 'badge-danger', label: 'Critical' };
    }

    function renderKPIs(data) {
      const kpis = computeKPIs(data);
      const p50s = getP50Status(kpis.p50);
      const p95s = getP95Status(kpis.p95);
      const errs = getErrStatus(kpis.error_rate);

      document.getElementById('kpi-row').innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">P50 Latency</div>
          <div class="kpi-value-row">
            <span class="kpi-value">${kpis.p50.toFixed(1)}ms</span>
            <span class="badge ${p50s.badge}">${p50s.label}</span>
          </div>
          <div class="kpi-threshold">Threshold: &lt; 100ms</div>
          <div class="kpi-sparkline" id="spark-p50"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">P95 Latency</div>
          <div class="kpi-value-row">
            <span class="kpi-value">${kpis.p95.toFixed(1)}ms</span>
            <span class="badge ${p95s.badge}">${p95s.label}</span>
          </div>
          <div class="kpi-threshold">Threshold: &lt; 200ms</div>
          <div class="kpi-sparkline" id="spark-p95"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Error Rate</div>
          <div class="kpi-value-row">
            <span class="kpi-value">${kpis.error_rate.toFixed(2)}%</span>
            <span class="badge ${errs.badge}">${errs.label}</span>
          </div>
          <div class="kpi-threshold">Threshold: &lt; 1%</div>
          <div class="kpi-sparkline" id="spark-err"></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Avg QPS</div>
          <div class="kpi-value-row">
            <span class="kpi-value">${Math.round(kpis.qps).toLocaleString()}</span>
            <span class="badge badge-info">Total</span>
          </div>
          <div class="kpi-threshold">Across all endpoints</div>
          <div class="kpi-sparkline" id="spark-qps"></div>
        </div>
      `;

      // Render sparklines
      renderSparklines();
    }

    function renderSparklines() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const lineColor = isDark ? '#60a5fa' : '#2d4a6e';
      const areaColor = isDark ? 'rgba(96,165,250,0.15)' : 'rgba(45,74,110,0.10)';
      const trend = getFilteredLatencyTrend();
      const dates = trend.map(d => d.date.slice(5));

      const sparkOpts = (values) => ({
        animation: false,
        grid: { left: 0, right: 0, top: 2, bottom: 2 },
        xAxis: { type: 'category', show: false, data: dates },
        yAxis: { type: 'value', show: false },
        series: [{
          type: 'line', data: values, symbol: 'none', smooth: true,
          lineStyle: { color: lineColor, width: 2 },
          areaStyle: { color: areaColor },
        }],
      });

      const sparkIds = [
        { id: 'spark-p50', values: trend.map(d => d.p50) },
        { id: 'spark-p95', values: trend.map(d => d.p95) },
        { id: 'spark-err', values: getFilteredDailyData().reduce((acc, d) => {
          const idx = getFilteredDates().indexOf(d.date);
          if (idx >= 0) {
            if (!acc[idx]) acc[idx] = { sum: 0, count: 0 };
            acc[idx].sum += d.error_rate;
            acc[idx].count++;
          }
          return acc;
        }, []).map(d => d ? +(d.sum / d.count).toFixed(2) : 0) },
        { id: 'spark-qps', values: getFilteredDates().map((date, i) => {
          let total = 0;
          ENDPOINTS.forEach(ep => {
            const offset = ALL_DATES.length - currentRange;
            total += QPS_BY_ENDPOINT[ep][offset + i] || 0;
          });
          return Math.round(total / ENDPOINTS.length);
        }) },
      ];

      sparkIds.forEach(s => {
        const el = document.getElementById(s.id);
        if (el) {
          const existing = echarts.getInstanceByDom(el);
          const chart = existing || echarts.init(el);
          chart.setOption(sparkOpts(s.values), true);
          if (!existing) {
            window.addEventListener('resize', () => chart.resize());
          }
        }
      });
    }

    // ── Charts ──
    function renderLatencyTrend() {
      if (!charts.latency) charts.latency = initChart('chart-latency');
      const theme = getChartThemeColors();
      const trend = getFilteredLatencyTrend();
      const dates = trend.map(d => d.date.slice(5));

      charts.latency.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
        },
        legend: {
          top: 5,
          textStyle: { fontSize: 12, color: theme.textColor },
        },
        grid: { left: 55, right: 20, top: 36, bottom: 40 },
        xAxis: {
          type: 'category', data: dates,
          axisLabel: { rotate: 30, fontSize: 10, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: {
          type: 'value', name: 'Latency (ms)',
          nameTextStyle: { color: theme.textColor },
          axisLabel: { color: theme.textColor },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        series: [
          { name: 'P50', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            lineStyle: { width: 2 }, itemStyle: { color: SERIES_COLORS[3] },
            data: trend.map(d => d.p50) },
          { name: 'P95', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            lineStyle: { width: 2 }, itemStyle: { color: SERIES_COLORS[2] },
            data: trend.map(d => d.p95) },
          { name: 'P99', type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
            lineStyle: { width: 2 }, itemStyle: { color: SERIES_COLORS[0] },
            data: trend.map(d => d.p99) },
        ],
      }, true);
    }

    function renderErrorDonut() {
      if (!charts.errorDonut) charts.errorDonut = initChart('chart-error-donut');
      const theme = getChartThemeColors();
      const items = Object.entries(ERROR_TYPES).map(([name, value]) => ({ name, value }));

      charts.errorDonut.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: {
          orient: 'vertical', right: 10, top: 'center',
          textStyle: { fontSize: 11, color: theme.textColor },
        },
        series: [{
          type: 'pie', radius: ['40%', '70%'], center: ['40%', '50%'],
          data: items.map((item, i) => ({
            name: item.name, value: item.value,
            itemStyle: { color: SERIES_COLORS[i] },
          })),
          label: {
            formatter: params => `${params.percent.toFixed(1)}%`,
            fontSize: 11, color: theme.textColor,
          },
          emphasis: {
            itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,0.2)' },
          },
        }],
      }, true);
    }

    function renderErrorBar() {
      if (!charts.errorBar) charts.errorBar = initChart('chart-error-bar');
      const theme = getChartThemeColors();

      // Compute error rate by endpoint from filtered data
      const filtered = getFilteredDailyData();
      const epErrors = {};
      const epCounts = {};
      filtered.forEach(d => {
        if (!epErrors[d.endpoint]) { epErrors[d.endpoint] = 0; epCounts[d.endpoint] = 0; }
        epErrors[d.endpoint] += d.error_rate;
        epCounts[d.endpoint]++;
      });
      const labels = ENDPOINTS.map(ep => ep);
      const values = ENDPOINTS.map(ep => +((epErrors[ep] || 0) / (epCounts[ep] || 1)).toFixed(2));

      charts.errorBar.setOption({
        tooltip: {
          trigger: 'axis', axisPointer: { type: 'shadow' },
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
          formatter: params => `${params[0].name}<br/>Error Rate: ${params[0].value}%`
        },
        grid: { left: 120, right: 50, top: 10, bottom: 30 },
        xAxis: {
          type: 'value', name: 'Error Rate (%)',
          nameTextStyle: { color: theme.textColor },
          axisLabel: { color: theme.textColor },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        yAxis: {
          type: 'category', data: labels, inverse: true,
          axisLabel: { fontSize: 11, width: 110, overflow: 'truncate', color: theme.textColor },
        },
        series: [{
          type: 'bar',
          data: values.map((v, i) => ({
            value: v, itemStyle: { color: SERIES_COLORS[i] },
          })),
          barWidth: '60%',
          label: { show: true, position: 'right', fontSize: 10, color: theme.textColor,
            formatter: p => p.value + '%' },
        }],
      }, true);
    }

    function renderQPSChart() {
      if (!charts.qps) charts.qps = initChart('chart-qps');
      const theme = getChartThemeColors();
      const dates = getFilteredDates().map(d => d.slice(5));
      const filteredQPS = getFilteredQPS();

      charts.qps.setOption({
        tooltip: {
          trigger: 'axis',
          backgroundColor: theme.backgroundColor,
          borderColor: theme.axisLineColor,
          textStyle: { color: theme.textColor },
        },
        legend: {
          top: 5,
          textStyle: { fontSize: 12, color: theme.textColor },
        },
        grid: { left: 55, right: 20, top: 36, bottom: 40 },
        xAxis: {
          type: 'category', data: dates,
          axisLabel: { rotate: 30, fontSize: 10, color: theme.textColor },
          axisLine: { lineStyle: { color: theme.axisLineColor } },
        },
        yAxis: {
          type: 'value', name: 'QPS',
          nameTextStyle: { color: theme.textColor },
          axisLabel: { color: theme.textColor },
          splitLine: { lineStyle: { color: theme.splitLineColor } },
        },
        series: ENDPOINTS.map((ep, i) => ({
          name: ep, type: 'line', smooth: true, symbol: 'circle', symbolSize: 5,
          lineStyle: { width: 2 }, itemStyle: { color: SERIES_COLORS[i] },
          data: filteredQPS[ep],
        })),
      }, true);
    }

    // ── Table ──
    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(d => `
        <tr>
          <td data-value="${d.date}">${d.date}</td>
          <td data-value="${d.endpoint}">${d.endpoint}</td>
          <td data-value="${d.p50}">${d.p50.toFixed(1)}</td>
          <td data-value="${d.p95}">${d.p95.toFixed(1)}</td>
          <td data-value="${d.p99}">${d.p99.toFixed(1)}</td>
          <td data-value="${d.error_rate}"><span class="badge ${d.error_rate < 0.3 ? 'badge-success' : d.error_rate < 0.5 ? 'badge-warning' : 'badge-danger'}">${d.error_rate.toFixed(2)}%</span></td>
          <td data-value="${d.qps}">${Math.round(d.qps).toLocaleString()}</td>
        </tr>
      `).join('');
      sortState = { column: -1, direction: 1 };
      updateSortIcons(-1);
    }

    // ── Sorting ──
    function sortTable(columnIndex) {
      const tbody = document.getElementById('table-body');
      const rows = Array.from(tbody.rows);

      if (sortState.column === columnIndex) {
        sortState.direction *= -1;
      } else {
        sortState.column = columnIndex;
        sortState.direction = 1;
      }

      rows.sort((a, b) => {
        const va = a.cells[columnIndex].getAttribute('data-value') || a.cells[columnIndex].textContent;
        const vb = b.cells[columnIndex].getAttribute('data-value') || b.cells[columnIndex].textContent;
        const na = parseFloat(va), nb = parseFloat(vb);
        if (!isNaN(na) && !isNaN(nb)) return sortState.direction * (na - nb);
        return sortState.direction * va.localeCompare(vb);
      });

      rows.forEach(row => tbody.appendChild(row));
      updateSortIcons(columnIndex);
    }

    function updateSortIcons(activeCol) {
      document.querySelectorAll('.data-table th').forEach((th, i) => {
        th.classList.toggle('sorted', i === activeCol);
        const icon = th.querySelector('.sort-icon');
        if (icon) {
          icon.className = 'sort-icon fas ' +
            (i === activeCol
              ? (sortState.direction === 1 ? 'fa-sort-up' : 'fa-sort-down')
              : 'fa-sort');
        }
      });
    }

    // ── Filter ──
    function filterByRange(days, btn) {
      currentRange = days;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderAll();
    }

    // ── Render all ──
    function renderAll() {
      const filtered = getFilteredDailyData();
      renderKPIs(filtered);
      renderLatencyTrend();
      renderErrorDonut();
      renderErrorBar();
      renderQPSChart();
      renderTable(filtered);
    }

    // ── Theme change observer ──
    const observer = new MutationObserver(() => {
      renderAll();
    });
    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    // ── Init ──
    initTheme();
    renderAll();
  </script>
</body>
</html>
